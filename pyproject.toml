[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docuqueryai"
version = "3.0.0"
description = "LLM-powered document ingestion, retrieval, and grounded Q&A over PDF/DOCX/XLSX/CSV documents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.optional-dependencies]
# `pip install -e ".[dev]"` is the one place test-only dependencies are
# declared — no separate requirements-dev.txt to keep in sync.
dev = ["pytest==8.2.0"]

[tool.setuptools.dynamic]
# Single source of truth: the same requirements.txt used by Docker and
# `pip install -r requirements.txt` also backs the packaged dependency list.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
# "src" is the package itself here (src/__init__.py makes it one), not a
# container to search inside — so discovery starts at the repo root, not
# where = ["src"] (which would instead look for packages *inside* src/ and
# install each one top-level, e.g. "api" instead of "src.api").
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Canonical invocation is `pytest` (or `pytest -v`) from the repository
# root. pythonpath here means that still works even without `pip install
# -e .` first, but the package is also properly installable — see README's
# Installation section.
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
